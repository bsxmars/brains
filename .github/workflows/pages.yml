# Собирает сайт и публикует его на GitHub Pages при каждом пуше в main.
# Один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права — по задачам, а не на весь workflow: `build` исполняет install-скрипты сотни пакетов
# (npm ci), и прав на публикацию у него быть не должно. Публикует только `deploy`.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Сайт живёт на https://<user>.github.io/<repo>/: базу знает сборщик, см. astro.config.mjs.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
